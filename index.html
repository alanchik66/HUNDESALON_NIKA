    <script>
      (function () {
        const langs = { ru: 'ru', uk: 'uk', en: 'en', de: 'de' };
        const pathParts = window.location.pathname.split('/').filter(Boolean);
        const pathLang = pathParts[0] && langs[pathParts[0]] ? pathParts[0] : null;
        const buildLangUrl = lang => new URL('/' + langs[lang] + '/index.html', window.location.origin).toString();

        if (pathLang) {
          return;
        }

        const savedLang = localStorage.getItem('preferred_lang');
        if (savedLang && langs[savedLang]) {
          window.location.replace(buildLangUrl(savedLang));
          return;
        }
        const userLang = (navigator.language || navigator.userLanguage).substring(0, 2).toLowerCase();
        window.location.replace(buildLangUrl(langs[userLang] ? userLang : 'de'));
      })();
    </script>
