#-------------------------------------------------------------------------------#
#        Discover additional configuration options in our documentation         #
#              https://www.jetbrains.com/help/qodana/gitlab.html                #
#-------------------------------------------------------------------------------#

include:
  - component: $CI_SERVER_FQDN/qodana/qodana/qodana-gitlab-ci@v2026.1
    inputs:
      # When mr-mode is set to true, Qodana analyzes only the files that have been changed
      mr-mode: false
      use-caches: true
      post-mr-comment: true
      # Upload Qodana results (SARIF, other artifacts, logs) as an artifact to the job
      upload-result: false
      # quick-fixes available in Ultimate and Ultimate Plus plans
      push-fixes: 'none'

qodana:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "auto/report_20260703_103656"

# GitLab CI/CD — HUNDESALON NIKA
# Зеркальный пайплайн GitHub Actions CI

stages:
  - security
  - validate
  - build

variables:
  NODE_VERSION: '24'

# ─── Кэширование npm ──────────────────────────────────────────────────
.npm-cache: &npm-cache
  cache:
    key:
      files:
        - package-lock.json
        - integrations/google-gateway/package-lock.json
    paths:
      - node_modules/
      - integrations/google-gateway/node_modules/
    policy: pull-push

# ─── Аудит зависимостей (GitHub Dependabot parity) ─────────────────────
dependency_audit:
  stage: security
  image: node:${NODE_VERSION}-alpine
  <<: *npm-cache
  before_script:
    - npm ci --prefer-offline
    - npm --prefix integrations/google-gateway ci --prefer-offline
  script:
    - npm run audit:all
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"

# ─── Валидация (линтеры + проверка ссылок) ─────────────────────────────
validate:
  stage: validate
  image: node:${NODE_VERSION}-alpine
  <<: *npm-cache
  before_script:
    - npm ci --prefer-offline
  script:
    - npm run validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"

# ─── Сборка продакшен-бандла ──────────────────────────────────────────
build:
  stage: build
  image: node:${NODE_VERSION}-alpine
  <<: *npm-cache
  before_script:
    - npm ci --prefer-offline
  script:
    - npm run build:production
  artifacts:
    paths:
      - dist/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
