version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    commit-message:
      prefix: chore
      include: scope
    groups:
      node-tooling:
        patterns:
          - eslint
          - htmlhint
          - prettier
          - stylelint*
          - playwright
          - serve
          - wrangler
      transitive-security:
        dependency-type: development
        update-types:
          - patch
          - minor

  - package-ecosystem: npm
    directory: /integrations/google-gateway
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: '06:15'
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - security
      - integrations
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - dependencies
      - security
      - ci
    commit-message:
      prefix: chore
      include: scope
