name: CI

# Optional while GitHub account billing can lock Actions runners.
# Production validate/deploy path: `npm run validate` / `npm run deploy:full` (Wrangler).
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    name: Validate and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Google gateway dependencies
        run: npm --prefix integrations/google-gateway ci

      - name: Audit dependencies
        run: npm run audit:all

      - name: Validate
        run: npm run validate

      - name: Build production bundle
        run: npm run build:production
