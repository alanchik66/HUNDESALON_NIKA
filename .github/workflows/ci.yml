name: CI

# Validate both proposed changes and the actual production branch.
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    name: Validate and build
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.production-artifact.outputs.artifact-id }}
      asset_stamp: ${{ steps.release-manifest.outputs.asset_stamp }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for browser quality gates
        run: npx playwright install --with-deps chromium

      - name: Install Google gateway dependencies
        run: npm --prefix integrations/google-gateway ci

      - name: Run the complete release quality gate
        run: npm run qa:max

      - name: Check client registration recovery in every locale and viewport
        run: node tools/client-registration-smoke.mjs

      - name: Record the tested production artifact
        id: release-manifest
        run: node tools/verify-production-release.mjs --prepare --commit "$GITHUB_SHA"

      - name: Preserve the exact tested production bundle
        id: production-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: production-dist-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  security:
    name: Require current-revision security results
    needs: validate-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Reject stale analyses and open alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/check-code-scanning.mjs

  deploy:
    name: Deploy validated production revision
    needs: [validate-build, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
      deployments: write
      security-events: read
    uses: ./.github/workflows/cloudflare-pages.yml
    with:
      artifact_id: ${{ needs.validate-build.outputs.artifact_id }}
      asset_stamp: ${{ needs.validate-build.outputs.asset_stamp }}
      release_commit: ${{ github.sha }}
    secrets: inherit
