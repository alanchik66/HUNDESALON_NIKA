name: CI

# Validate both proposed changes and the actual production branch.
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    name: Validate and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for browser quality gates
        run: npx playwright install --with-deps chromium

      - name: Install Google gateway dependencies
        run: npm --prefix integrations/google-gateway ci

      - name: Audit dependencies
        run: npm run audit:all

      - name: Validate
        run: npm run validate

      - name: Build production bundle
        run: npm run build:production

      - name: Enforce production asset budgets
        run: npm run check:budgets

      - name: Run visual and accessibility smoke tests
        run: npm run test:browser

      - name: Check client registration recovery in every locale and viewport
        run: node tools/client-registration-smoke.mjs

  security:
    name: Require current-revision security results
    needs: validate-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Reject stale analyses and open alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/check-code-scanning.mjs

  deploy:
    name: Deploy validated production revision
    needs: [validate-build, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      deployments: write
      security-events: read
    uses: ./.github/workflows/cloudflare-pages.yml
    secrets: inherit
