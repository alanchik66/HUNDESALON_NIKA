name: Qodana

on:
  workflow_dispatch:

# Disabled: requires QODANA_TOKEN (JetBrains Cloud subscription)
# To enable: add QODANA_TOKEN secret and change "on:" to include push/pull_request

permissions:
  contents: read
  checks: write
  pull-requests: read

concurrency:
  group: qodana-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    name: Static quality scan
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.1
        with:
          pr-mode: ${{ github.event_name == 'pull_request' }}
          use-caches: true
          post-pr-comment: false
          use-annotations: true
          upload-result: false
          push-fixes: none
