name: Security

# Analyze the same revision as CI. The deployment gate requires these results.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          vulnerability-check: true
          license-check: false

      - name: Skip dependency review on push
        if: github.event_name != 'pull_request'
        run: echo "Dependency review runs on pull requests only; marking push job successful."

  codeql:
    name: CodeQL JavaScript analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: .github/workflows/security.yml:codeql

  semgrep:
    name: Semgrep JavaScript analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check 'semgrep==1.170.1'

      - name: Run Semgrep scan
        run: semgrep scan --config p/javascript --config p/nodejs assets/js functions tools --sarif --output semgrep.sarif

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  release-gate:
    name: Require reviewed current-revision security results
    needs: [dependency-review, codeql, semgrep]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Reject stale analyses and open alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/check-code-scanning.mjs
