name: Deploy Cloudflare Pages

# Called only after the CI quality gates pass. Manual runs repeat those gates.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Google gateway dependencies for manual validation
        if: github.event_name == 'workflow_dispatch'
        run: npm --prefix integrations/google-gateway ci

      - name: Audit dependencies for manual deployment
        if: github.event_name == 'workflow_dispatch'
        run: npm run audit:all

      - name: Validate manual deployment
        if: github.event_name == 'workflow_dispatch'
        run: npm run validate

      - name: Build production bundle
        run: npm run build:production

      - name: Enforce production asset budgets
        run: npm run check:budgets

      - name: Install Chromium for manual browser checks
        if: github.event_name == 'workflow_dispatch'
        run: npx playwright install --with-deps chromium

      - name: Verify browser behavior for manual deployment
        if: github.event_name == 'workflow_dispatch'
        run: npm run test:browser && node tools/client-registration-smoke.mjs

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 25e872aeab8cb246c69142ab07cd0fee
        run: npx wrangler pages deploy dist --project-name=hundesalon-nika --commit-dirty=true

      - name: Purge Cloudflare zone cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 25e872aeab8cb246c69142ab07cd0fee
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::No Cloudflare API token is set; zone cache was not purged."
          elif ! npm run cf:purge-cache; then
            echo "::warning::Deployment succeeded, but the zone cache purge failed (token needs Zone Read + Cache Purge); cached assets may be stale."
          fi
