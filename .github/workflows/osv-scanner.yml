name: OSV Dependency Scan

# Push/schedule disabled while GitHub billing can lock Actions (Gmail spam).
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: osv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv-scan:
    name: OSV Scanner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@8e5cf47b818121e8b405931c82126c2630b0b20d # v2.3.8
        with:
          scan-args: |-
            --recursive
            .
            --format
            sarif
            --output
            results.sarif

      - name: Upload OSV SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: osv-scanner
