# Cloudflare Pages — конфигурация
# Документация: https://developers.cloudflare.com/pages/

name = "hundesalon-nika"
compatibility_date = "2026-08-08"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "CHAT_DB"
database_name = "nika-db"
database_id = "b95aa18e-fca6-408b-91f9-8e262b6acf41"
preview_database_id = "6df5c8b1-6f8d-4ff6-851e-d7f149c31009"

[[env.preview.d1_databases]]
binding = "CHAT_DB"
database_name = "nika-db-preview"
database_id = "6df5c8b1-6f8d-4ff6-851e-d7f149c31009"
preview_database_id = "6df5c8b1-6f8d-4ff6-851e-d7f149c31009"

# Preview has its own database and no production service credentials.
[env.preview.vars]
SITE_NOTIFICATIONS_ENABLED = "false"
PAYMENTS_ONLINE_ENABLED = "false"

# Для локальной разработки с Pages Functions:
#   npm run dev:cf
#
# Для деплоя через CLI:
#   npm run deploy
#
# Переменные окружения задаются в Cloudflare Dashboard:
#   Pages → hundesalon-nika → Settings → Environment variables
#   SENDPULSE_API_KEY = <ваш ключ SendPulse>
